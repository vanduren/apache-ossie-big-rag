# Apache Ossie (incubating) — semantisch model
# Core Metadata Specification versie 0.2.0.dev0
# https://github.com/apache/ossie/blob/main/core-spec/spec.md
#
# Use case: bloemenwebshop "Knol & Bloei"
# Dit model is de SINGLE SOURCE OF TRUTH voor metrics en dimensies.
# Zowel de demo-app (CustomTkinter), de CLI als een AI-agent lezen ditzelfde bestand.

version: 0.2.0.dev0
name: knol_en_bloei
description: Verkoopanalyse voor bloemenwebshop "Knol & Bloei" (omzet, marge, volumes, klanten, producten, leveranciers, bezorging en beoordelingen)

ai_context:
  instructions: >
    Gebruik dit model voor alle verkoopvragen van Knol & Bloei.
    Bedragen zijn in euro's (incl. btw). "Omzet" betekent altijd SUM(regel_bedrag)
    over orderregels, inclusief korting; "marge" gaat uit van het verschil tussen
    verkoop- en inkoopprijs (model-metrics brutomarge en margepercentage).
    Gebruik bestel_maand voor maandrapportages. Beoordelingen (sterren) en
    verzendingen (bezorger, levertijd) hebben hun eigen feittabellen.
  synonyms:
    - verkoopanalyse
    - sales
    - klantanalyse
  examples:
    - "Wat is de omzet per categorie?"
    - "Hoeveel orders zijn er per maand geplaatst?"
    - "Welke stad geeft het meeste geld uit?"
    - "Wat is de brutomarge per leverancier?"
    - "Hoe lang duurt de bezorging gemiddeld per bezorger?"
    - "Wat zijn de bezorgkosten per maand?"

datasets:
  # ---------------------------------------------------------------- fact
  - name: orderregels
    source: webshop.orderregels
    primary_key: [bestelling_id, regel_nr]
    description: Één rij per besteld artikel op een bestelling (feittabel)
    ai_context:
      synonyms:
        - orderregels
        - verkoopregels
        - artikelen
    fields:
      - name: bestelling_id
        expression:
          sql: bestelling_id
        datatype: Integer
        description: Verwijzing naar de bestelling

      - name: regel_nr
        expression:
          sql: regel_nr
        datatype: Integer
        description: Regelnummer binnen de bestelling

      - name: product_id
        expression:
          sql: product_id
        datatype: Integer
        description: Verwezen product

      - name: aantal
        expression:
          sql: aantal
        datatype: Integer
        description: Aantal stuks
        ai_context:
          synonyms: ["stuks", "verkocht aantal"]

      - name: prijs_per_stuk
        expression:
          sql: prijs_per_stuk
        datatype: Decimal
        description: Brutoprijs per stuk in euro's

      - name: korting
        expression:
          sql: korting
        datatype: Decimal
        description: Kortingspercentage op de regel (0.0 - 1.0)

      - name: regel_bedrag
        expression:
          sql: aantal * prijs_per_stuk * (1 - korting)
        datatype: Decimal
        description: Nettobedrag van de regel (na korting)
        ai_context:
          synonyms: ["regelomzet", "nettobedrag"]

    # Dataset-scope metrics: verwijzen naar eigen velden met korte naam
    metrics:
      - name: omzet
        expression:
          sql: SUM(regel_bedrag)
        datatype: Decimal
        description: Totale netto-omzet (na korting)
        ai_context:
          synonyms: ["omzet", "revenue", "verkopen", "omzet in euro", "bestedingen", "geld"]

      - name: bruto_omzet
        expression:
          sql: SUM(aantal * prijs_per_stuk)
        datatype: Decimal
        description: Totale brutomzet (voor korting)
        ai_context:
          synonyms: ["brutomzet"]

      - name: verkochte_stukken
        expression:
          sql: SUM(aantal)
        datatype: Integer
        description: Totaal aantal verkochte stuks
        ai_context:
          synonyms: ["verkochte stuks", "volume", "aantal verkocht"]

      - name: gemiddelde_korting
        expression:
          sql: AVG(korting)
        datatype: Float
        description: Gemiddeld kortingspercentage per verkochte regel
        ai_context:
          synonyms: ["gemiddelde korting", "kortingspercentage"]

  # ------------------------------------------------------------ dimensies
  - name: bestellingen
    source: webshop.bestellingen
    primary_key: [bestelling_id]
    description: Bestelloverzicht (kop van de bestelling)
    ai_context:
      synonyms: ["orders", "bestellingen"]
    fields:
      - name: bestelling_id
        expression:
          sql: bestelling_id
        datatype: Integer
        description: Unieke bestelidentifier

      - name: klant_id
        expression:
          sql: klant_id
        datatype: Integer
        description: Bestellende klant

      - name: besteldatum
        expression:
          sql: besteldatum
        datatype: Date
        dimension:
          is_time: true
        description: Datum van bestelling
        ai_context:
          synonyms: ["besteldatum", "datum"]

      - name: bestel_maand
        expression:
          sql: substr(CAST(besteldatum AS TEXT), 1, 7)
        datatype: String
        dimension:
          is_time: true
        description: Maand van bestelling (YYYY-MM)
        ai_context:
          synonyms: ["maand", "per maand"]

      - name: bezorgd
        expression:
          sql: bezorgd
        datatype: Boolean
        description: Is de bestelling geleverd? (1=ja)

      - name: bestelbron
        expression:
          sql: bestelbron
        datatype: String
        description: Verkooppkanaal (website, mobiele app, e-mail)
        ai_context:
          synonyms: ["kanaal", "bron", "bestelkanaal", "hoe besteld"]

    metrics:
      - name: aantal_bestellingen
        expression:
          sql: COUNT(DISTINCT source.bestelling_id)
        description: Aantal bestellingen (unieke bestellingen)
        ai_context:
          synonyms: ["aantal bestellingen", "aantal orders", "orders", "bestellingen"]
          examples: ["Hoeveel orders zijn er per maand geplaatst?"]

  - name: producten
    source: webshop.producten
    primary_key: [product_id]
    description: Productcatalogus van Knol & Bloei
    ai_context:
      synonyms: ["assortiment", "producten"]
    fields:
      - name: product_id
        expression:
          sql: product_id
        datatype: Integer
        description: Productnummer

      - name: productnaam
        expression:
          sql: naam
        datatype: String
        description: Naam van het product
        ai_context:
          synonyms: ["product", "naam"]

      - name: categorie
        expression:
          sql: categorie
        datatype: String
        description: Productcategorie (bollen, zaden, snijbloemen, kamerplanten, abonnementen, accessoires)
        ai_context:
          synonyms: ["categorie", "soort", "productgroep"]

      - name: listenprijs
        expression:
          sql: prijs
        datatype: Decimal
        description: Catalogusprijs per stuk
        ai_context:
          synonyms: ["verkoopprijs", "prijs"]

      - name: inkoopprijs
        expression:
          sql: inkoopprijs
        datatype: Decimal
        description: Inkoopprijs per stuk bij de leverancier
        ai_context:
          synonyms: ["inkoop", "inkoopprijs", "cost price"]

      - name: leverancier_id
        expression:
          sql: leverancier_id
        datatype: Integer
        description: Verwijzing naar de toeleverende leverancier

  # ------------------------------------------------------- leveranciers
  - name: leveranciers
    source: webshop.leveranciers
    primary_key: [leverancier_id]
    description: Toeleveranciers (kwekers, exporteurs en groothandels) van Knol & Bloei
    ai_context:
      synonyms: ["kwekers", "toeleveranciers", "leveranciers"]
    fields:
      - name: leverancier_id
        expression:
          sql: leverancier_id
        datatype: Integer
        description: Leveranciersnummer

      - name: leverancier_naam
        expression:
          sql: naam
        datatype: String
        description: Naam van de leverancier
        ai_context:
          synonyms: ["leverancier", "leveranciers", "kweker", "teler"]

      - name: land
        expression:
          sql: land
        datatype: String
        description: Land van herkomst (o.a. Nederland, Kenia, Ecuador, Colombia)
        ai_context:
          synonyms: ["land", "herkomst", "telerland", "leveranciersland"]

      - name: levertijd_dagen
        expression:
          sql: levertijd_dagen
        datatype: Integer
        description: Levertermijn van de leverancier in dagen
        ai_context:
          synonyms: ["levertermijn", "levertijd leverancier"]

  # -------------------------------------------------------- verzendingen
  - name: verzendingen
    source: webshop.verzendingen
    primary_key: [verzending_id]
    description: Één verzending per bezorgde bestelling (koerier, kosten en duur)
    ai_context:
      synonyms: ["bezorgingen", "leveringen", "verzendingen"]
    fields:
      - name: verzending_id
        expression:
          sql: verzending_id
        datatype: Integer
        description: Verzendingsnummer

      - name: bestelling_id
        expression:
          sql: bestelling_id
        datatype: Integer
        description: Verwijzing naar de bestelling (1:1)

      - name: bezorger
        expression:
          sql: bezorger
        datatype: String
        description: Uitvoerende bezorgdienst (PostNL, DHL, Budbee, eigen bezorgdienst)
        ai_context:
          synonyms: ["bezorger", "koerier", "bezorgdienst"]

      - name: verzendkosten
        expression:
          sql: verzendkosten
        datatype: Decimal
        description: Verzendkosten van de verzending in euro's
        ai_context:
          synonyms: ["verzendingskosten", "kosten van de bezorging"]

      - name: verzend_datum
        expression:
          sql: verzend_datum
        datatype: Date
        dimension:
          is_time: true
        description: Datum van verzending
        ai_context:
          synonyms: ["verzenddatum", "verzendingdatum"]

      - name: levertijd_dagen
        expression:
          sql: levertijd_dagen
        datatype: Integer
        description: Aantal dagen tussen bestelling en bezorging
        ai_context:
          synonyms: ["bezorgduur", "bezorgtijd", "levertijd van bezorging"]

    metrics:
      - name: gemiddelde_verzendkosten
        expression:
          sql: AVG(verzendkosten)
        datatype: Decimal
        description: Gemiddelde verzendkosten per verzending
        ai_context:
          synonyms: ["gemiddelde verzendkosten", "gemiddelde bezorgkosten"]

      - name: totale_verzendkosten
        expression:
          sql: SUM(verzendkosten)
        datatype: Decimal
        description: Totale verzendkosten over alle verzendingen
        ai_context:
          synonyms: ["verzendkosten", "totale verzendkosten", "bezorgkosten"]

      - name: gemiddelde_levertijd
        expression:
          sql: AVG(levertijd_dagen)
        datatype: Float
        description: Gemiddelde bezorgduur in dagen
        ai_context:
          synonyms: ["gemiddelde levertijd", "levertijd", "bezorgduur", "gemiddelde bezorgduur", "hoe lang duurt de bezorging"]

  # ------------------------------------------------------- beoordelingen
  - name: beoordelingen
    source: webshop.beoordelingen
    primary_key: [beoordeling_id]
    description: Klantbeoordelingen (1-5 sterren) op gekochte producten
    ai_context:
      synonyms: ["reviews", "klantbeoordelingen"]
    fields:
      - name: beoordeling_id
        expression:
          sql: beoordeling_id
        datatype: Integer
        description: Beoordelingsnummer

      - name: klant_id
        expression:
          sql: klant_id
        datatype: Integer
        description: Reagerende klant

      - name: product_id
        expression:
          sql: product_id
        datatype: Integer
        description: Beoordeeld product

      - name: sterren
        expression:
          sql: sterren
        datatype: Integer
        description: Aantal sterren (1 = slecht … 5 = uitstekend)
        ai_context:
          synonyms: ["sterren", "score", "beoordelingsscore", "stars"]

      - name: beoordeeld_op
        expression:
          sql: beoordeeld_op
        datatype: Date
        dimension:
          is_time: true
        description: Datum van de beoordeling
        ai_context:
          synonyms: ["beoordeldatum"]

    metrics:
      - name: gemiddelde_sterren
        expression:
          sql: AVG(sterren)
        datatype: Float
        description: Gemiddelde sterrenscore van de beoordelingen
        ai_context:
          synonyms: ["gemiddelde sterren", "gemiddelde score", "sterrenscore", "hoe tevreden"]

      - name: aantal_beoordelingen
        expression:
          sql: COUNT(DISTINCT source.beoordeling_id)
        datatype: Integer
        description: Aantal geplaatste beoordelingen
        ai_context:
          synonyms: ["aantal beoordelingen", "aantal reviews", "reviews"]

  - name: klanten
    source: webshop.klanten
    primary_key: [klant_id]
    description: Klantenbestand van de webshop
    ai_context:
      synonyms: ["kopers", "klanten"]
    fields:
      - name: klant_id
        expression:
          sql: klant_id
        datatype: Integer
        description: Klantnummer

      - name: klantnaam
        expression:
          sql: naam
        datatype: String
        description: Naam van de klant
        ai_context:
          synonyms: ["klant", "naam"]

      - name: stad
        expression:
          sql: stad
        datatype: String
        description: Woonplaats van de klant
        ai_context:
          synonyms: ["stad", "plaats", "regio"]

      - name: segment
        expression:
          sql: segment
        datatype: String
        description: Klantsegment (particulier of zakelijk)
        ai_context:
          synonyms: ["segment", "klanttype"]

# --------------------------------------------------------------- joins
relationships:
  - name: regels_naar_bestellingen
    from: orderregels
    to: bestellingen
    from_columns: [bestelling_id]
    to_columns: [bestelling_id]

  - name: regels_naar_producten
    from: orderregels
    to: producten
    from_columns: [product_id]
    to_columns: [product_id]

  - name: bestellingen_naar_klanten
    from: bestellingen
    to: klanten
    from_columns: [klant_id]
    to_columns: [klant_id]

  - name: producten_naar_leveranciers
    from: producten
    to: leveranciers
    from_columns: [leverancier_id]
    to_columns: [leverancier_id]

  - name: bestellingen_naar_verzendingen
    from: bestellingen
    to: verzendingen
    from_columns: [bestelling_id]
    to_columns: [bestelling_id]

  - name: beoordelingen_naar_klanten
    from: beoordelingen
    to: klanten
    from_columns: [klant_id]
    to_columns: [klant_id]

  - name: beoordelingen_naar_producten
    from: beoordelingen
    to: producten
    from_columns: [product_id]
    to_columns: [product_id]

# Model-scope metrics: combineren velden over meerdere datasets (dataset.veld)
metrics:
  - name: omzet_per_klant
    expression:
      sql: SUM(orderregels.regel_bedrag) / COUNT(DISTINCT klanten.klant_id)
    datatype: Decimal
    description: Gemiddelde besteedbare omzet per klant
    ai_context:
      synonyms: ["omzet per klant", "ARPU", "gemiddelde besteding"]

  - name: gemiddelde_orderwaarde
    expression:
      sql: SUM(orderregels.regel_bedrag) / COUNT(DISTINCT bestellingen.bestelling_id)
    datatype: Decimal
    description: Gemiddeld besteedbedrag per bestelling
    ai_context:
      synonyms: ["gemiddelde orderwaarde", "average order value", "AOV"]

  - name: brutomarge
    expression:
      sql: SUM(orderregels.regel_bedrag) - SUM(orderregels.aantal * producten.inkoopprijs)
    datatype: Decimal
    description: Brutomarge — verkoopbedrag na korting minus inkoopwaarde van de verkochte stuks
    ai_context:
      synonyms: ["brutomarge", "marge", "winst", "gross margin"]

  - name: margepercentage
    expression:
      sql: 1 - SUM(orderregels.aantal * producten.inkoopprijs) / SUM(orderregels.regel_bedrag)
    datatype: Float
    description: Brutomarge als deel van de netto-omzet (0.0 - 1.0)
    ai_context:
      synonyms: ["margepercentage", "marge in procent", "winstmarge", "brutomarge percentage"]

  - name: verzendkosten_per_order
    expression:
      sql: SUM(verzendingen.verzendkosten) / COUNT(DISTINCT bestellingen.bestelling_id)
    datatype: Decimal
    description: Gemiddelde verzendkosten per bestelde order (met bezorging)
    ai_context:
      synonyms: ["verzendkosten per order", "gemiddelde verzendkosten per bestelling"]

# Vendor-extensies: door Ossie gedragen, maar niet geïnterpreteerd
custom_extensions:
  - vendor_name: DEMO
    data: '{"database": "sqlite", "path": "data/webshop.db", "dialect_voorkeur": ["SQLITE", "OSSIE_SQL_2026"]}'
