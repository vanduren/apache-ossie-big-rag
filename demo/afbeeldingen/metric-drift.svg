<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350"><rect width="1200" height="350" rx="24" fill="#f5f2ea"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#173b32">Zonder gedeelde definitie: metric drift</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="110" width="300" height="170" rx="18" fill="#fff" stroke="#bd6c53" stroke-width="3"/><text x="220" y="155" font-size="24" fill="#173b32">Dashboard</text><text x="220" y="202" font-size="21" fill="#824c40">Omzet = vóór korting</text><text x="220" y="242" font-size="24" font-weight="bold" fill="#824c40">€ 12.400</text><rect x="450" y="110" width="300" height="170" rx="18" fill="#fff" stroke="#bd6c53" stroke-width="3"/><text x="600" y="155" font-size="24" fill="#173b32">Analist</text><text x="600" y="202" font-size="21" fill="#824c40">Omzet = na korting</text><text x="600" y="242" font-size="24" font-weight="bold" fill="#824c40">€ 11.870</text><rect x="830" y="110" width="300" height="170" rx="18" fill="#fff" stroke="#bd6c53" stroke-width="3"/><text x="980" y="155" font-size="24" fill="#173b32">AI-assistent</text><text x="980" y="202" font-size="21" fill="#824c40">Omzet = eigen aanname</text><text x="980" y="242" font-size="24" font-weight="bold" fill="#824c40">€ 12.090</text></g><text x="600" y="325" text-anchor="middle" font-family="Arial" font-size="19" fill="#47635b">Eén begrip, drie definities — het model legt de afspraak expliciet vast.</text></svg>
